aid: connecteam
name: Connecteam
description: 'Connecteam is a mobile-first workforce management platform for deskless
  and non-desk teams, bundling time clock and GPS timesheets, job scheduling, task
  boards, digital forms and checklists, chat and company communication, HR onboarding,
  time off, pay rates and sales data into three purchasable hubs (Operations, Communications,
  HR & Skills). Its public REST API at api.connecteam.com is described by an OpenAPI
  3.1 contract covering 145 operations across 98 paths, authenticated either with a
  company X-API-KEY header or OAuth 2.0 client-credentials tokens scoped across 61
  named permissions, and it declares 41 webhook events for time activity, shifts, users,
  tasks, forms and chat. API access is gated to the Expert plan and above, with per-plan
  rate limits surfaced in x-ratelimit-* response headers.'
