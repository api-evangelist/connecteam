openapi: 3.2.0
info:
  title: Connecteam API documentation Company…
  version: v1
servers:
- url: https://api.connecteam.com/
tags:
- name: Company Policies:v1:UserCustomSchedulingRulePolicies
paths:
  /company-policies/v1/users/{userId}/scheduling-rule-policies:
    get:
      tags:
      - Company Policies:v1:UserCustomSchedulingRulePolicies
      summary: Get user scheduling rule policies
      description: Retrieve the scheduling rule policies assigned to a user, including employee-profile custom rules
      operationId: get_user_scheduling_rule_policies_company_policies_v1_users__userId__scheduling_rule_policies_get
      security:
      - APIKeyHeader: []
      - OAuth2:
        - company_policies.read
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          title: Userid
          description: The unique identifier of the user
          minimum: 1
          type: integer
        description: The unique identifier of the user
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_SchedulingRulePoliciesResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    SchedulingRuleModel:
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/SchedulingRuleType'
          description: The type of scheduling rule
        value:
          type: number
          title: Value
          description: The value for the scheduling rule (e.g., hours or number of shifts)
        preventClaim:
          type: boolean
          title: Preventclaim
          description: Whether to prevent shift claims that would violate this rule
          default: true
        applyToSpecificSchedulerId:
          type: integer
          title: Applytospecificschedulerid
          description: If set, this rule only applies to the specified scheduler
        applyToSpecificShifts:
          type: object
          title: Applytospecificshifts
          description: 'Advanced filter to limit which shifts this rule applies to. Structure: {op: ''and''|''or'', filters: [...]}'
      type: object
      required:
      - type
      - value
      title: SchedulingRuleModel
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SchedulingRulePoliciesResponse:
      properties:
        schedulingRulePolicies:
          items:
            $ref: '#/components/schemas/SchedulingRulePolicyResponse'
          type: array
          title: Schedulingrulepolicies
          description: List of scheduling rule policies
      type: object
      required:
      - schedulingRulePolicies
      title: SchedulingRulePoliciesResponse
    SchedulingRuleType:
      type: string
      enum:
      - maxHoursPerWeek
      - maxShiftsPerWeek
      - maxHoursPerDay
      - maxShiftsPerDay
      - minHoursBetweenShifts
      - minHoursPerWeek
      - minShiftsPerWeek
      title: SchedulingRuleType
      description: An enumeration.
    APIResponse_SchedulingRulePoliciesResponse_:
      properties:
        requestId:
          type: string
          title: Requestid
        data:
          $ref: '#/components/schemas/SchedulingRulePoliciesResponse'
      type: object
      required:
      - data
      title: APIResponse[SchedulingRulePoliciesResponse]
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SchedulingRulePolicyResponse:
      properties:
        id:
          type: integer
          title: Id
          description: The unique identifier of the scheduling rule policy
        name:
          type: string
          title: Name
          description: The name of the scheduling rule policy. Null for a user's custom policy, which is unnamed
        isEnabled:
          type: boolean
          title: Isenabled
          description: Whether the policy is enabled
        isDefaultForNewUsers:
          type: boolean
          title: Isdefaultfornewusers
          description: Whether this policy is automatically assigned to new users
        isCustomPolicy:
          type: boolean
          title: Iscustompolicy
          description: Whether this is a custom policy (custom policies are user-specific)
        rules:
          items:
            $ref: '#/components/schemas/SchedulingRuleModel'
          type: array
          title: Rules
          description: The list of scheduling rules in this policy
      type: object
      required:
      - id
      - name
      - isEnabled
      - isDefaultForNewUsers
      - isCustomPolicy
      - rules
      title: SchedulingRulePolicyResponse
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: The Api key of the company given by Connecteam
      in: header
      name: X-API-KEY
    OAuth2:
      type: oauth2
      description: OAuth2 Bearer token
      flows:
