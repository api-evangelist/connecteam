summary: >-
  Connecteam's published MCP server is a spec-explorer, not a data-plane projection of
  the REST API. Its three tools navigate the OpenAPI document itself (list, fetch,
  search endpoints) and return API metadata; none of them invokes a Connecteam business
  operation. So the crosswalk has no one-to-one tool -> operationId rows: all three tools
  are recorded as mcp_only (they are meta-operations over the contract, not backed by any
  public REST operation), and all 145 REST operations are rest_only (reachable through
  the MCP server only indirectly, by the agent reading the endpoint description and then
  issuing the HTTP call itself with its own credentials).
