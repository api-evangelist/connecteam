token_endpoint: https://api.connecteam.com/oauth/v1/token
token_lifetime_seconds: 86400
refresh_token: false
entitlement: API access requires the Expert plan or higher; the credential only reaches hubs on an eligible
  plan.
notes:
- The API key is company-wide and unscoped — it is equivalent to a password and grants everything the
  account's hubs allow. OAuth 2.0 client credentials is the scoped, short-lived alternative and is the
  correct choice for agents.
- HTTPBasic is used ONLY to authenticate the token request (client_id as username, client_secret as password);
  it is not an API-call credential.
- No OpenID Connect, no /.well-known/oauth-authorization-server metadata, no mTLS.
