openapi: 3.2.0
info:
  title: Connecteam API documentation Forms:v1:Form Submissions API
  version: v1
servers:
- url: https://api.connecteam.com/
tags:
- name: Forms:v1:Form Submissions
paths:
  /forms/v1/forms/{formId}/form-submissions:
    get:
      tags:
      - Forms:v1:Form Submissions
      summary: Get form submissions
      description: Retrieve a list of form submissions by form ID
      operationId: get_form_submissions_forms_v1_forms__formId__form_submissions_get
      security:
      - APIKeyHeader: []
      - OAuth2:
        - forms.read
      parameters:
      - name: formId
        in: path
        required: true
        schema:
          title: Formid
          description: Filter by Form Id
          minimum: 1
          type: integer
        description: Filter by Form Id
      - name: userIds
        in: query
        required: false
        schema:
          title: Userids
          description: Filter by submitting user ids
          type: array
          items:
            type: integer
        description: Filter by submitting user ids
      - name: submittingStartTimestamp
        in: query
        required: false
        schema:
          title: Submittingstarttimestamp
          description: Filter form submissions that were submitted from this timestamp
          type: integer
        description: Filter form submissions that were submitted from this timestamp
      - name: submittingEndTime
        in: query
        required: false
        schema:
          title: Submittingendtime
          description: Filter form submissions that were submitted until this timestamp
          type: integer
        description: Filter form submissions that were submitted until this timestamp
      - name: limit
        in: query
        required: false
        schema:
          title: Limit
          description: The maximum number of results to display per page
          default: 10
          minimum: 1
          maximum: 100
          type: integer
        description: The maximum number of results to display per page
      - name: offset
        in: query
        required: false
        schema:
          title: Offset
          description: The resource offset of the last successfully read resource will be returned as the paging.offset JSON property of a paginated response containing more results
          default: 0
          minimum: 0
          type: integer
        description: The resource offset of the last successfully read resource will be returned as the paging.offset JSON property of a paginated response containing more results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBaseResponse_FormsSubmissionsGetResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /forms/v1/forms/{formId}/form-submissions/{formSubmissionId}:
    get:
      tags:
      - Forms:v1:Form Submissions
      summary: Get form submission
      description: Retrieve a single form submission by form submission ID
      operationId: get_form_submission_forms_v1_forms__formId__form_submissions__formSubmissionId__get
      security:
      - APIKeyHeader: []
      - OAuth2:
        - forms.read
      parameters:
      - name: formId
        in: path
        required: true
        schema:
          title: Formid
          description: Form Id
          minimum: 1
          type: integer
        description: Form Id
      - name: formSubmissionId
        in: path
        required: true
        schema:
          title: Formsubmissionid
          description: Filter by Form submission id
          type: string
        description: Filter by Form submission id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_FormsSubmissionGetResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Forms:v1:Form Submissions
      summary: Update form submission
      description: Update a single form submission by form submission ID. Currently, updates are only supported for manager fields.
      operationId: update_form_submissions_forms_v1_forms__formId__form_submissions__formSubmissionId__put
      security:
      - APIKeyHeader: []
      - OAuth2:
        - forms.write
      parameters:
      - name: formId
        in: path
        required: true
        schema:
          title: Formid
          description: Form Id
          minimum: 1
          type: integer
        description: Form Id
      - name: formSubmissionId
        in: path
        required: true
        schema:
          title: Formsubmissionid
          description: Filter by Form submission id
          type: string
        description: Filter by Form submission id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Form Submission
              allOf:
              - $ref: '#/components/schemas/FormSubmissionPutRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_FormsSubmissionPutResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ManagerFieldSignatureRequest:
      properties:
        managerFieldId:
          type: string
          title: Managerfieldid
          description: The manager field id
        managerFieldType:
          type: string
          enum:
          - signature
          title: Managerfieldtype
          description: The manager field type
          default: signature
        image:
          type: string
          title: Image
          description: The signature
        signingUserId:
          type: integer
          minimum: 1.0
          title: Signinguserid
          description: The signing user id
        signingTimestamp:
          type: integer
          minimum: 1.0
          title: Signingtimestamp
          description: The signing timestamp
      type: object
      required:
      - managerFieldId
      - image
      - signingUserId
      - signingTimestamp
      title: ManagerFieldSignatureRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    FilesAnswer:
      properties:
        questionId:
          type: string
          title: Questionid
          description: The questions id.
        wasHidden:
          type: boolean
          title: Washidden
          description: Whether the submission was hidden (by a condition).
        submissionTimestamp:
          type: integer
          title: Submissiontimestamp
          description: The timestamp of the submission.
        location:
          allOf:
          - $ref: '#/components/schemas/GpsData'
          title: Location
          description: The location of the submission.
        updateTimestamp:
          type: integer
          title: Updatetimestamp
          description: The timestamp of the last update.
        updateUserId:
          type: integer
          title: Updateuserid
          description: The user id of the last update.
        wasSubmittedEmpty:
          type: boolean
          title: Wassubmittedempty
          description: Whether the submission was empty.
        questionType:
          type: string
          enum:
          - files
          title: Questiontype
          description: The questions type
          default: files
        files:
          items:
            $ref: '#/components/schemas/FormFileModel'
          type: array
          title: Files
          description: The files.
      type: object
      required:
      - questionId
      - wasSubmittedEmpty
      - files
      title: FilesAnswer
    ManagerFieldNote:
      properties:
        managerFieldId:
          type: string
          title: Managerfieldid
          description: The manager field id.
        managerFieldType:
          type: string
          enum:
          - note
          title: Managerfieldtype
          description: The field type
          default: note
        note:
          type: string
          title: Note
          description: The note filled in the field.
      type: object
      required:
      - managerFieldId
      title: ManagerFieldNote
    ManagerFieldOwner:
      properties:
        managerFieldId:
          type: string
          title: Managerfieldid
          description: The manager field id.
        managerFieldType:
          type: string
          enum:
          - owner
          title: Managerfieldtype
          description: The field type
          default: owner
        userId:
          type: integer
          title: Userid
          description: The user id of the assigned owner.
      type: object
      required:
      - managerFieldId
      title: ManagerFieldOwner
    YesNoAnswer:
      properties:
        questionId:
          type: string
          title: Questionid
          description: The questions id.
        wasHidden:
          type: boolean
          title: Washidden
          description: Whether the submission was hidden (by a condition).
        submissionTimestamp:
          type: integer
          title: Submissiontimestamp
          description: The timestamp of the submission.
        location:
          allOf:
          - $ref: '#/components/schemas/GpsData'
          title: Location
          description: The location of the submission.
        updateTimestamp:
          type: integer
          title: Updatetimestamp
          description: The timestamp of the last update.
        updateUserId:
          type: integer
          title: Updateuserid
          description: The user id of the last update.
        wasSubmittedEmpty:
          type: boolean
          title: Wassubmittedempty
