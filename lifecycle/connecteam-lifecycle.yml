    contract: >-
      Beta endpoints may change request/response schemas, validation rules, error codes,
      pagination behaviour and availability, and documentation may be updated without a
      prior deprecation window. Beta endpoints do not carry the same backward-compatibility
      guarantees as generally available endpoints.
    labelling: '"Beta" in the endpoint title or a callout on the page in the API Reference'
    contact: omer.vered@connecteam.com
    guidance:
    - Parse responses flexibly; ignore unknown fields
    - Avoid hard dependencies on Beta-only fields in critical production workflows
    - Monitor the changelog for graduation announcements
