x-enrichment-notes:
  no_agent_card: >-
    No A2A agent card exists. /.well-known/agent-card.json and /.well-known/agent.json
    404 on connecteam.com and developer.connecteam.com; api.connecteam.com answers 200
    with an HTML application shell for every path, which is a catch-all false positive,
    not a card. Nothing was authored.
  no_official_sdks: >-
    No SDKs pointer was emitted. Connecteam publishes zero first-party client libraries
    and its docs explicitly disclaim the third-party SDK shown in the API reference
    sandbox.
  no_idempotency: >-
    No Idempotency pointer was emitted. Connecteam publishes no Idempotency-Key contract;
    only the lock-days PUT documents natural idempotency.
  no_security_disclosure: >-
    No Security pointer was emitted. There is no security.txt, responsible-disclosure
    page, bug bounty or security@ contact on any Connecteam host.
  no_deprecation_policy: >-
    No Deprecation pointer was emitted. Connecteam publishes a Beta-stability contract but
    no deprecation/sunset policy for GA endpoints and no RFC 8594 headers.
  no_asyncapi: >-
    No AsyncAPI pointer was emitted. The 41 events are declared natively in the OpenAPI
    3.1 `webhooks` object; no AsyncAPI document is published, so only Webhooks was wired.
  not_applicable: [sandbox, cli, components, grpc, decline-codes, graphql]
