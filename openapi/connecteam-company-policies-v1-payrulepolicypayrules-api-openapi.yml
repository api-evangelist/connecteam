openapi: 3.2.0
info:
  title: Connecteam API documentation Company…
  version: v1
servers:
- url: https://api.connecteam.com/
tags:
- name: Company Policies:v1:PayRulePolicyPayRules
paths:
  /company-policies/v1/pay-rule-policies/{payRulePolicyId}/pay-rules/{payRuleId}:
    put:
      tags:
      - Company Policies:v1:PayRulePolicyPayRules
      summary: Add pay rule to pay rule policy
      description: Add an existing pay rule to the specified pay rule policy. Adding a regular pay rule replaces the policy's current regular pay rule. Adding a pay rule the policy already contains succeeds unchanged.
      operationId: add_pay_rule_to_policy_company_policies_v1_pay_rule_policies__payRulePolicyId__pay_rules__payRuleId__put
      security:
      - APIKeyHeader: []
      - OAuth2:
        - company_policies.write
      parameters:
      - name: payRulePolicyId
        in: path
        required: true
        schema:
          title: Payrulepolicyid
          description: The unique identifier of the pay rule policy
          type: integer
        description: The unique identifier of the pay rule policy
      - name: payRuleId
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the pay rule
          title: Payruleid
        description: The unique identifier of the pay rule
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseV2_PayRulePolicy_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Company Policies:v1:PayRulePolicyPayRules
      summary: Remove pay rule from pay rule policy
      description: Remove a pay rule from the specified pay rule policy. The policy itself and its user assignments are never deleted by this operation.
      operationId: remove_pay_rule_from_policy_company_policies_v1_pay_rule_policies__payRulePolicyId__pay_rules__payRuleId__delete
      security:
      - APIKeyHeader: []
      - OAuth2:
        - company_policies.delete
      parameters:
      - name: payRulePolicyId
        in: path
        required: true
        schema:
          title: Payrulepolicyid
          description: The unique identifier of the pay rule policy
          type: integer
        description: The unique identifier of the pay rule policy
      - name: payRuleId
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the pay rule
          title: Payruleid
        description: The unique identifier of the pay rule
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseV2_BaseResponseV2_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PayRulePolicyPayRule:
      properties:
        id:
          type: string
          title: Id
          description: The pay rule id
        name:
          type: string
          title: Name
          description: The pay rule name
      type: object
      required:
      - id
      - name
      title: PayRulePolicyPayRule
    APIResponseV2_BaseResponseV2_:
      properties:
        requestId:
          type: string
          title: Requestid
        data:
          $ref: '#/components/schemas/BaseResponseV2'
      type: object
      required:
      - data
      title: APIResponseV2[BaseResponseV2]
    BaseResponseV2:
      properties: {}
      type: object
      title: BaseResponseV2
      description: V2 base response model
    APIResponseV2_PayRulePolicy_:
      properties:
        requestId:
          type: string
          title: Requestid
        data:
          $ref: '#/components/schemas/PayRulePolicy'
      type: object
      required:
      - data
      title: APIResponseV2[PayRulePolicy]
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    PayRulePolicy:
      properties:
        id:
          type: integer
          title: Id
          description: The pay rule policy id
        name:
          type: string
          title: Name
          description: The pay rule policy name
        isDefaultForNewUsers:
          type: boolean
          title: Isdefaultfornewusers
          description: Whether the policy is assigned to new users by default
          default: false
        payRules:
          items:
            $ref: '#/components/schemas/PayRulePolicyPayRule'
          type: array
          title: Payrules
          description: List of pay rules included in the policy
      type: object
      required:
      - id
      - name
      title: PayRulePolicy
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: The Api key of the company given by Connecteam
      in: header
      name: X-API-KEY
    OAuth2:
      type: oauth2
      description: OAuth2 Bearer token
      flows:
        clientCredentials:
          scopes:
            account_information.read: account information - read
            account_information.write: account information - write
            account_information.delete: account information - delete
            company_policies.read: company policies - read
            company_policies.write: company policies - write
            company_policies.delete: company policies - delete
            company_insights.read: company insights - read
            users.read: users - read
            users.write: users - write
            users.delete: users - delete
            assets.read: assets - read
            assets.write: assets - write
            assets.delete: assets - delete
            sales_data.read: sales data - read
            sales_data.write: sales data - write
            sales_data.delete: sales data - delete
            attachments.read: attachments - read
            attachments.write: attachments - write
            attachments.delete: attachments - delete
            quick_tasks.read: quick tasks - read
            quick_tasks.write: quick tasks - write
            quick_tasks.delete: quick tasks - delete
            publishers.read: publishers - read
            publishers.write: publishers - write
            publishers.delete: publishers - delete
            chat.read: chat - read
            chat.write: chat - write
            chat.delete: chat - delete
            jobs.read: jobs - read
            jobs.write: jobs - write
            jobs.delete: jobs - delete
            schedule.read: schedule - read
            schedule.write: schedule - write
            schedule.delete: schedule - delete
            daily_note.read: daily note - read
            daily_note.write: daily note - write
            daily_note.delete: daily note - delete
            time_clock.read: time clock - read
            time_clock.write: time clock - write
            time_clock.delete: time clock - delete
            nfc.read: nfc - read
            nfc.write: nfc - write
            nfc.delete: nfc - delete
            time_off.read: time off - read
            time_off.write: time off - write
            time_off.delete: time off - delete
            pay_rates.read: pay rates - read
            pay_rates.write: pay rates - write
            pay_rates.delete: pay rates - delete
            forms.read: forms - read
            forms.write: forms - write
            forms.delete: forms - delete
            onboarding.read: onboarding - read
            onboarding.write: onboarding - write
            onboarding.delete: onboarding - delete
            settings.read: settings - read
            settings.write: settings - write
            settings.delete: settings - delete
            company_checklist.read: company checklist - read
            company_checklist.write: company checklist - write
            recognitions.read: recognitions - read
            celebrations.read: celebrations - read
            documents.read: documents - read
            documents.write: documents - write
          tokenUrl: /oauth/v1/token
    HTTPBasic:
      type: http
      description: Use client_id as Username and client_secret as Password
      scheme: basic
