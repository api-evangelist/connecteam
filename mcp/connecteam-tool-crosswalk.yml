    served as a static document at https://api.connecteam.com/openapi.json.
- tool: get-endpoint
  reason: >-
    Meta-operation — returns one endpoint's detail including security schemes and servers,
    read out of the spec document. No backing REST operation.
- tool: search-endpoints
