      required:
      - questionId
      - wasSubmittedEmpty
      title: YesNoAnswer
    ManagerFieldFile:
      properties:
        managerFieldId:
          type: string
          title: Managerfieldid
          description: The manager field id.
        managerFieldType:
          type: string
          enum:
          - file
          title: Managerfieldtype
          description: The field type
          default: file
        files:
          items:
            $ref: '#/components/schemas/ManagerFieldFileModel'
          type: array
          title: Files
          description: The files.
      type: object
      required:
      - managerFieldId
      title: ManagerFieldFile
    FormSubmissionResponse:
      properties:
        formSubmissionId:
          type: string
          title: Formsubmissionid
          description: The form submission id.
        formId:
          type: integer
          title: Formid
          description: The forms id.
        submissionTimestamp:
          type: integer
          title: Submissiontimestamp
          description: The timestamp of the submission.
        submissionTimezone:
          type: string
          title: Submissiontimezone
          description: The timezone of the submission.
        entryNum:
          type: integer
